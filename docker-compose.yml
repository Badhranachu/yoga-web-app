# Production-only compose file for the Hostinger VPS. Local development
# does not use Docker — it continues with `npm run dev` (frontend) and
# `python manage.py runserver` (backend) against .env.local.
#
# .env.production supplies every variable for every service purely via
# `env_file:` below — nothing in this file uses `${VAR}` substitution, so
# nothing here depends on Docker Compose's separate (and easy to forget)
# auto-load of a file literally named `.env`. That's what makes the
# plain, no-flags commands below work every time:
#   docker compose down
#   docker compose up -d --build
#   docker compose restart
#   docker compose logs -f
#   docker compose exec backend python manage.py migrate

services:
  db:
    image: mysql:8
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - yoga_net
    healthcheck:
      # CMD-SHELL (not CMD) so $MYSQL_ROOT_PASSWORD is expanded by the
      # shell INSIDE the container, from the env_file-injected value —
      # $$ escapes Compose's own top-level substitution so it passes the
      # literal `$MYSQL_ROOT_PASSWORD` straight through instead of trying
      # to resolve it itself.
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # No `ports:` — MySQL is reachable only from other containers on
    # yoga_net (backend connects via DB_HOST=db), never from the host.

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:8005:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - yoga_net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8000/admin/login/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3005:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - yoga_net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

networks:
  yoga_net:
    driver: bridge

volumes:
  mysql_data:
