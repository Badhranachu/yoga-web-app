# Server block for the production frontend image (see Dockerfile). This
# replaces only nginx's default site config at /etc/nginx/conf.d/default.conf
# — the image's own main /etc/nginx/nginx.conf (worker user, mime types,
# etc.) is untouched.
#
# The VPS's system nginx reverse-proxies harmonyfusion.yoga to this
# container (host port 3005 -> container port 80) and separately routes
# /api to the backend container — this server block only ever needs to
# serve the built React app, not proxy API requests itself.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router owns client-side routes like /dashboard/bookings —
    # they don't exist as real files, so any path nginx can't find on
    # disk falls back to index.html and lets the app's own router
    # resolve it. Without this, a hard refresh or direct link to a
    # client-side route would 404 at the nginx layer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite hashes every built JS/CSS/asset filename (e.g.
    # index-CqGB_VTM.js) — a content change always produces a new
    # filename, so these are safe to cache aggressively and immutably.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html is what references the current build's hashed asset
    # filenames — it must never be cached, or a browser could keep
    # serving an old index.html pointing at assets from a previous
    # deploy that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
