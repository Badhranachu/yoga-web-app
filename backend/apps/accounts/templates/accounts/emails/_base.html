<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Harmony Fusion Studio{% endblock %}</title>
</head>
<body style="margin:0; padding:0; background-color:#F5EFE5; font-family: Georgia, 'Times New Roman', serif; color:#2B241E;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F5EFE5; padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px; background-color:#FFFFFF; border-radius:24px; overflow:hidden; border:1px solid rgba(43,36,30,0.08);">

          <!-- Header -->
          <tr>
            <td style="background-color:#2B241E; padding:28px 32px;">
              <span style="font-family: Georgia, 'Times New Roman', serif; font-size:22px; color:#FFFFFF;">Harmony</span>
              <span style="font-family: Georgia, 'Times New Roman', serif; font-size:22px; font-style:italic; color:#D8B46A;"> Fusion Studio</span>
            </td>
          </tr>

          <!-- Body -->
          <tr>
            <td style="padding:32px;">
              {% block body %}{% endblock %}
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td style="padding:20px 32px; border-top:1px solid rgba(43,36,30,0.08);">
              <p style="margin:0; font-family: Arial, Helvetica, sans-serif; font-size:12px; color:#786A58;">
                Harmony Fusion Studio &middot; This is an automated message, please don't reply directly to this email.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
