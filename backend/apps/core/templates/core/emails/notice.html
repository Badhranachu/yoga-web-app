{% extends "core/emails/_base.html" %}
{% block title %}{{ heading }}{% endblock %}
{% block body %}
  <p style="margin:0 0 16px; font-family: Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#2B241E;">
    Hello{% if first_name %} {{ first_name }}{% endif %},
  </p>

  {% for paragraph in paragraphs %}
  <p style="margin:0 0 16px; font-family: Arial, Helvetica, sans-serif; font-size:15px; line-height:1.6; color:#2B241E;">
    {{ paragraph }}
  </p>
  {% endfor %}

  {% if cta_url %}
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
    <tr>
      <td align="center" style="padding-top:8px;">
        <a href="{{ cta_url }}" style="display:inline-block; background-color:#2B241E; color:#F5EFE5; font-family: Arial, Helvetica, sans-serif; font-size:13px; letter-spacing:1.5px; text-transform:uppercase; text-decoration:none; padding:14px 32px; border-radius:999px;">
          {{ cta_label }}
        </a>
      </td>
    </tr>
  </table>
  {% endif %}
{% endblock %}
